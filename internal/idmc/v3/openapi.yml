openapi: '3.0.0'
info:
  title:   'Admin API for IDMC'
  version: '3.0.0'
externalDocs:
  url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources.html
paths:

  /public/core/v3/login:
    post:
      operationId: login
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources/login.html
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/loginRequestBody'
      responses:
        200:
          description: |-
            Returns user information if the request is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/loginResponseBody'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/privileges:
    parameters:
      - name:  q
        in:    query
        style: simple
        schema:
          type: string
        description: |-
          The query string used to filter results.
        example: |-
          /public/core/v3/privileges?q=status==All
    get:
      operationId: listPrivileges
      description: |-
        Use the privileges resource to obtain a list of privileges that you can use for custom roles.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform_rest_api_version_3_resources/privileges.html
      responses:
        200:
          description: |-
            A successful response provides a list of privilege objects matching the implicit or explicit query.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/rolePrivilegeItem'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/roles:
    description: |-
      You can request the details for all of your organization's roles or request the details for a particular role.
    get:
      operationId: getRoles
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources/roles/getting-role-details.html
      parameters:
        - $ref: '#/components/parameters/headerSession'
        - name: q
          in:   query
          schema:
            type: string
          description: |-
            Query filter. You can filter using one of the following fields:
            * roleId. Unique identifier for the role.
            * roleName. Name of the role.
          example: |-
            /public/core/v3/roles?q=roleName=="Business Manager"&expand=privileges
        - name: expand
          in:   query
          description: |-
            Returns the privileges associated with the role specified in the query filter.
          schema:
            type: string
            enum:
              - privileges
      responses:
        200:
          description: |-
            Returns role information if successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getRolesResponseBody'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'
    post:
      operationId: createRole
      description: You can create custom roles for your organization.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/createRoleRequestBody'
      responses:
        201:
          description: |-
            If successful, returns the roles object with the details you included in the POST request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/createRoleResponseBody'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/roles/{role_ref}:
    parameters:
      - $ref: '#/components/parameters/headerSession'
      - $ref: '#/components/parameters/pathRole'
    delete:
      operationId: deleteRole
      description: |-
        You can delete custom roles from your organization.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources/roles/deleting-a-role.html
      responses:
        200:
          description: A successful deletion.
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/roles/{role_ref}/addPrivileges:
    parameters:
      - $ref: '#/components/parameters/headerSession'
      - $ref: '#/components/parameters/pathRole'
    put:
      operationId: addRolePrivileges
      description: |-
        You can add privileges for custom roles.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources/roles/updating-a-role.html
      requestBody:
        $ref: '#/components/requestBodies/rolePrivileges'
      responses:
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/roles/{role_ref}/removePrivileges:
    parameters:
      - $ref: '#/components/parameters/headerSession'
      - $ref: '#/components/parameters/pathRole'
    put:
      operationId: removeRolePrivileges
      description: |-
        You can add privileges for custom roles.
        You can't remove all of the privileges from a role. A role must have at least one privilege assigned to it.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/platform-rest-api-version-3-resources/roles/updating-a-role.html
      requestBody:
        $ref: '#/components/requestBodies/rolePrivileges'
      responses:
        204:
          $ref: '#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users:
    parameters:
      - $ref: '#/components/parameters/headerSession'
    get:
      operationId: getUser
      description: |-
        Use the users resource to request Informatica Intelligent Cloud Services user details. You can request the details for all users in the organization or request the details for a particular user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/getting-user-details.html
      parameters:
        - $ref: '#/components/parameters/getUserQuery'
        - $ref: '#/components/parameters/getUserLimit'
        - $ref: '#/components/parameters/getUserSkip'
      responses:
        200:
          description: |-
            User(s) fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/getUserResponseBody'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'
    post:
      operationId: createUser
      description: |-
        If you have administrator privileges, you can use the users resource to create a user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/creating-a-user.html
      requestBody:
        $ref: '#/components/requestBodies/createUserRequest'
      responses:
        200:
          description: |-
            User created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userDetails'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users/{user_id}:
    delete:
      operationId: deleteUser
      description: |-
        If you have administrator privileges, you can use the users resource to delete a user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/deleting-a-user.html
      parameters:
        - $ref: '#/components/parameters/pathUserId'
      responses:
        204:
          $ref: '../common/openapi.yml#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users/{user_id}/addRoles:
    parameters:
      - $ref: '#/components/parameters/pathUserId'
    put:
      operationId: addUserRoles
      description: |-
        Will assign the provided roles to the user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/updating-role-assignments.html
      requestBody:
        $ref: '#/components/requestBodies/roleNamesRequest'
      responses:
        204:
          $ref: '../common/openapi.yml#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users/name/{user_name}/addRoles:
    parameters:
      - $ref: '#/components/parameters/pathUserName'
    put:
      operationId: addUserRolesByName
      description: |-
        Will assign the provided roles to the user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/updating-role-assignments.html
      requestBody:
        $ref: '#/components/requestBodies/roleNamesRequest'
      responses:
        204:
          $ref: '../common/openapi.yml#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users/{user_id}/removeRoles:
    parameters:
      - $ref: '#/components/parameters/pathUserId'
    put:
      operationId: removeUserRoles
      description: |-
        Will remove role assignments from the user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/updating-role-assignments.html
      requestBody:
        $ref: '#/components/requestBodies/roleNamesRequest'
      responses:
        204:
          $ref: '../common/openapi.yml#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

  /public/core/v3/users/name/{user_name}/removeRoles:
    parameters:
      - $ref: '#/components/parameters/pathUserName'
    put:
      operationId: removeUserRolesByName
      description: |-
        Will remove role assignments from the user.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/platform-rest-api-version-3-resources/users/updating-role-assignments.html
      requestBody:
        $ref: '#/components/requestBodies/roleNamesRequest'
      responses:
        204:
          $ref: '../common/openapi.yml#/components/responses/204'
        400:
          $ref: '#/components/responses/400'
        401:
          $ref: '#/components/responses/401'
        403:
          $ref: '#/components/responses/403'
        404:
          $ref: '#/components/responses/404'
        500:
          $ref: '#/components/responses/500'
        502:
          $ref: '#/components/responses/502'
        503:
          $ref: '#/components/responses/503'

components:

  parameters:

    headerSession:
      name: INFA-SESSION-ID
      in:   header
      schema:
        type: string
      required: true

    pathRole:
      name: role_ref
      in:   path
      schema:
        type: string
      required: true
      description: |-
        Either role id or role name.

    pathUserId:
      name: user_id
      in:   path
      schema:
        type: string
      required: true
      description: |-
        Id of the user to act on.

    pathUserName:
      name: user_name
      in:   path
      schema:
        type: string
      required: true
      description: |-
        Name of the user to act on.

    getUserQuery:
      name: q
      in: query
      style: simple
      schema:
        type: string
      description: |-
        Query filter. You can filter using one of the following fields:
        * userId. Unique identifier for the user.
        * userName. Informatica Intelligent Cloud Services user name.
      example: |-
        /public/core/v3/users?q=userId==5N9JGth6pRYfOGjGKv3Q2D

    getUserLimit:
      name: limit
      in: query
      style: simple
      schema:
        type: integer
        default: 100
        minimum: 1 # assumed.
        maximum: 200
      description: |-
        Maximum number of users to return.
        Maximum of 200. Default is 100.
      example: |-
        /public/core/v3/users?q=userId==5N9JGth6pRYfOGjGKv3Q2D&limit=1

    getUserSkip:
      name: skip
      in: query
      style: simple
      schema:
        type: integer
        default: 0
        minimum: 0
      description: |-
        Amount to offset the list of results.
        Default is 0.
      example: |-
        /public/core/v3/users?q=userId==5N9JGth6pRYfOGjGKv3Q2D&limit=1&skip=0

  requestBodies:

    rolePrivileges:
      description: |-
        A partial role object with an array of privileges.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/updateRoleRequestBody'

    createUserRequest:
      description: |-
        Configurable aspects of user creation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/createUserRequestBody'

    roleNamesRequest:
      description: |-
        A list of role names.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/roleNamesRequestBody'

  # https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/informatica-intelligent-cloud-services-rest-api/rest-api-responses.html
  responses:

    204:
      description: |-
        Successful operation with no response data.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody' # tentative

    400:
      description: |-
        Bad request. Can be a field or format issue such as an invalid character or incorrect string length.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    401:
      description: |-
        Authentication issue. For example, invalid credentials or invalid session IDs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    403:
      description: |-
        Generic error. For example, user doesn't have required permissions for a resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    404:
      description: |-
        Resource can't be found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    500:
      description: |-
        Unexpected error. Generic error message that appears when an unexpected condition was encountered.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    502:
      description: |-
        Network issue.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

    503:
      description: |-
        Service unavailable. The server cannot handle the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/apiErrorResponseBody'

  schemas:

    apiErrorResponseBody:
      description: |-
        When the REST API encounters an error, it returns a REST API error object.
      externalDocs:
        url: https://docs.informatica.com/integration-cloud/data-integration/current-version/rest-api-reference/informatica-intelligent-cloud-services-rest-api/error-object.html
      type: object
      properties:
        error:
          $ref: '#/components/schemas/apiError'
      required:
        - error
      example: |-
        {
          "error": {
            "code": "IDS_085",
            "message": "User name or password is not valid.",
            "requestId": "9hr8e2ObIcChbwYftgDui7",
            "details": null
          }
        }
    apiError:
      type: object
      allOf:
        - $ref: '#/components/schemas/apiErrorDetail'
        - properties:
            requestId:
              type: string
            details:
              type: array
              items:
                $ref: '#/components/schemas/apiErrorDetail'
          required:
            - requestId
    apiErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        debugMessage:
          type: string
      required:
        - code
        - message

    userDetailsEditable:
      type: object
      description: |-
        User details that are editable and common between create and fetch.
      properties:
        # name not defined because it changes key between create and get
        firstName:
          type: string
          description: |-
            First name for the user account.
        lastName:
          type: string
          description: |-
            Last name for the user account.
        description:
          type: string
          description: |-
            Description of the user.
        email:
          type: string
          description: |-
            Email address for the user.
        title:
          type: string
          description: |-
            Job title of the user.
        phone:
          type: string
          description: |-
            Phone number for the user.
          nullable: true
        forcePasswordChange:
          type: boolean
          description: |-
            Determines whether the user must reset the password after the user logs in for the first time.
        maxLoginAttempts:
          type: integer
          description: |-
            Number of times a user can attempt to log in before the account is locked.
        authentication:
          type: integer
          description: |-
            Determines whether the user accesses Informatica Intelligent Cloud Services through single sign-in (SAML).
            Use one of the following values:
            0. Native.
            1. SAML.
          enum:
            - 0
            - 1
        aliasName:
          type: string
          description: |-
            The user identifier or user name in the 3rd party system.
        roles:
          type: array
          description: |-
            IDs of the roles to assign to the user.
          items:
            type: string
          uniqueItems: true
        groups:
          type: array
          description: |-
            IDs of the user groups to assign to the user.
          items:
            type: string
          uniqueItems: true
      required:
        - firstName
        - lastName
        - email

    userDetails:
      allOf:
        - $ref: '../common/openapi.yml#/components/schemas/resourceIds'
        - $ref: '../common/openapi.yml#/components/schemas/resourceAudit'
        - $ref: '#/components/schemas/userDetailsEditable'
        - type: object
          description: |-
            User details that are provided by the platform.
          properties:
            userName:
              type: string
              description: |-
                Informatica Intelligent Cloud Services user name.
            state:
              type: string
              description: |-
                State of the user account. Returns one of the following values:
                * Active. User account exists and user has activated the account.
                * Provisioned. User account exists but the user has not activated the account.
                * Disabled. User account is disabled because the user exceeded the maximum number of login attempts.
                NOTE: If the user's password is expired, the value is null.
              enum:
                - Active
                - Provisioned
                - Disabled
              readOnly: true
            timeZoneId:
              type: string
              description: |-
                Time zone of the user.
                For more information, see Time zone codes:
                https://docs.informatica.com/integration-cloud/b2b-gateway/current-version/rest-api-reference/rest-api-codes/time-zone-codes.html
            lastLoginTime:
              type: string
              description: |-
                The date and time that the user last logged in.
              readOnly: true
              nullable: true
            lastLoginMode:
              type: string
              description: |-
                Whether the user logged in through a REST API call or through the UI.
              readOnly: true
            roles:
              type: array
              description: |-
                All the roles assigned to this user.
              items:
                $ref: '#/components/schemas/userDetailsRole'
            groups:
              type: array
              description: |-
                All the groups assigned to this user.
              items:
                $ref: '#/components/schemas/userDetailsGroup'
          required:
            - roles
            - groups
      example: |-
        {
          "id": "9EcgvBYZ9GGflOYr98GzOH",
          "orgId": "cPYWk02I4aBeuLEvYRtaMS",
          "createdBy": "a@abc.com",
          "updatedBy": "a@abc.com",
          "createTime": "2020-08-20T18:29:19.987Z",
          "updateTime": "2020-08-20T18:29:20.653Z",
          "userName": "c@abc.com",
          "firstName": "c",
          "lastName": "smith",
          "description": null,
          "title": "dev",
          "phone": null,
          "email": "c@abc.com",
          "state": "Provisioned",
          "timeZoneId": "America/Los_Angeles",
          "maxLoginAttempts": "10",
          "authentication": "Native",
          "forcePasswordChange": false,
          "lastLoginTime": null,
          "lastLoginMode": "None",
          "roles": [
            {
              "id": "5IPgtye09EbiWqz5XXuzwC",
              "roleName": "test",
              "description": ""
            },
            {
              "id": "9gedBDoYQoQibNMohf5KCh",
              "roleName": "Admin",
              "description": "Role for performing administrative tasks for an organization. Has full access to all licensed services."
            }
          ],
          "groups": [
            {
              "id": "a6x85hoMvH2kWUIlcIRBEh",
              "userGroupName": "group_a",
              "description": ""
            }
          ]
        }

    userDetailsRole:
      type: object
      description: |-
        Full reference object for a role assigned to a user.
      properties:
        id:
          type: string
          description: |-
            Role ID.
        roleName:
          type: string
          description: |-
            Role name.
        description:
          type: string
          description: |-
            Description of the role.
        displayName:
          type: string
          description: |-
            Role name that is displayed in the user interface.
        displayDescription:
          type: string
          description: |-
            Role description that is displayed in the user interface.
      required:
        - id
        - roleName
        - description

    userDetailsGroup:
      type: object
      description: |-
        Full reference object for a group assigned to a user.
      properties:
        id:
          type: string
          description: |-
            User group ID.
        userGroupName:
          type: string
          description: |-
            User group name.
        description:
          type: string
          description: |-
            Description of the user group.
      required:
        - id
        - userGroupName
        - description

    getUserResponseBody:
      type: array
      items:
        $ref: '#/components/schemas/userDetails'

    roleNamesRequestBody:
      type: object
      properties:
        roles:
          type: array
          description: |-
            A list of role names.
          items:
            type: string
          uniqueItems: true
          minLength: 1
      required:
        - roles

    createUserRequestBody:
      allOf:
        - $ref: '../common/openapi.yml#/components/schemas/resourceDetails'
        - $ref: '#/components/schemas/userDetailsEditable'
        - type: object
          properties:
            name:
              # just override the property description.
              description: |-
                Informatica Intelligent Cloud Services user name.
            password:
              type: string
              description: |-
                Informatica Intelligent Cloud Services password.
                If password is empty, the user receives an activation email.
                Maximum length is 255 characters.
              maxLength: 255
          required:
            - name
      example: |-
        {
          "name" : "c@abc.com",
          "firstName" : "c",
          "lastName" : "smith",
          "email" : "c@abc.com",
          "authentication" : 0,
          "roles" : ["5IPgtye09EbiWqz5XXuzwC", "9gedBDoYQoQibNMohf5KCh"],
          "groups" : ["a6x85hoMvH2kWUIlcIRBEh"]
        }

    loginRequestBody:
      type: object
      properties:
        username:
          type: string
          description: |-
            Informatica Intelligent Cloud Services user name for the organization that you want to log in to.
          maxLength: 255
        password:
          type: string
          description: |-
            Informatica Intelligent Cloud Services password.
          maxLength: 255
      required:
        - username
        - password

    loginResponseBody:
      type: object
      properties:
        products:
          type: array
          description: |-
            Subscribed Informatica products.
          items:
            $ref: '#/components/schemas/loginResponseBodyProduct'
        userInfo:
          $ref: '#/components/schemas/loginResponseBodyUserInfo'
      required:
        - userInfo
        - products
    loginResponseBodyProduct:
      type: object
      properties:
        name:
          type: string
          description: |-
            Product name.
        baseApiUrl:
          type: string
          description: |-
            Base API URL for the product. Use in REST API requests.
      required:
        - name
        - baseApiUrl
    loginResponseBodyUserInfo:
      type: object
      properties:
        sessionId:
          type: string
          description: |-
            REST API session ID for the current session. Use in most REST API request headers.
        id:
          type: string
          description: |-
            User ID.
        name:
          type: string
          description: |-
            User name.
        parentOrgId:
          type: string
          description: |-
            Organization ID for the parent.
          minLength: 22
          maxLength: 22
        orgId:
          type: string
          description: |-
            ID of the organization the user belongs to.
          minLength: 22
          maxLength: 22
        orgName:
          type: string
          description: |-
            Organization name.
        groups:
          type: object
          description: |-
            User group information for the user.
        status:
          type: string
          description: |-
            Status of the user.
          enum:
            - Active
            - Inactive
      required:
        - sessionId
        - id
        - name
        - parentOrgId
        - orgId
        - orgName
        - groups
        - status

    getRolesResponseBody:
      type: array
      items:
        $ref: '#/components/schemas/getRolesResponseBodyItem'
    getRolesResponseBodyItem:
      allOf:
        - $ref: '#/components/schemas/roleInfo'
        - $ref: '#/components/schemas/withPrivilegeItems'

    createRoleRequestBody:
      allOf:
        - $ref: '#/components/schemas/withPrivilegeRefs'
        - type: object
          properties:
            name:
              type: string
              description: |-
                Name of the role.
            description:
              type: string
              description: |-
                Description of the role.
      required:
        - name
        - privileges

    createRoleResponseBody:
      allOf:
        - $ref: '#/components/schemas/roleInfo'
        - $ref: '#/components/schemas/withPrivilegeItems'

    updateRoleRequestBody:
      type: object
      properties:
        privileges:
          type: array
          items:
            type:     string
            nullable: false
          description: |-
            IDs of the privileges to assign to the role.
            A role must have at least one privilege assigned to it.
          minItems: 1
      required:
        - privileges

    roleInfo:
      type: object
      properties:
        id:
          type: string
          description: |-
            Role ID.
        orgId:
          type: string
          description: |-
            ID of the organization the role belongs to.
        createdBy:
          type: string
          description: |-
            User who created the role.
        updatedBy:
          type: string
          description: |-
            User who last updated the role.
        createTime:
          type: string
          description: |-
            Date and time the role was created.
        updateTime:
          type: string
          description: |-
            Date and time the role was last updated.
        roleName:
          type: string
          description: |-
            Name of the role.
        description:
          type: string
          description: |-
            Description of the role.
        displayName:
          type: string
          description: |-
            Role name displayed in the user interface.
        displayDescription:
          type: string
          description: |-
            Description displayed in the user interface.
        systemRole:
          type: boolean
          description: |-
            Whether the role is a system-defined role.
        status:
          $ref: '#/components/schemas/roleStatus'

    roleStatus:
      type: string
      description: |-
        Whether the organization's license to use the role is valid or has expired.
      enum:
        - Enabled
        - Disabled

    withPrivilegeItems:
      type: object
      properties:
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/rolePrivilegeItem'
      example: |-
        {
          "privileges": [
            {
              "id": "0nTOXl8dzEwlSFoM0cO8gI",
              "name": "view.ai.designer",
              "description": "View application integration designer"
            },
            {
              "id": "aQwUdcM8RcQewA1yWphZ4F",
              "name": "view.ai.assets",
              "description": "View  application integration assets"
            }
          ]
        }
    rolePrivilegeItem:
      type: object
      properties:
        id:
          type: string
          description: |-
            Privilege ID.
        name:
          type: string
          description: |-
            Name of the privilege.
        description:
          type: string
          description: |-
            Description of the privilege.
        service:
          type: string
          description: |-
            The Informatica Intelligent Cloud Services service that applies to the privilege.
        status:
          type: string
          description: |-
            Status of the privilege. Returns one of the following values:
            * Enabled: License to use the privilege is valid.
            * Disabled: License to use the privilege has expired.
            * Unassigned: No license to use this privilege.
            * Default: Privilege included by default.
          enum:
            - Enabled
            - Disabled
            - Default
            - Unassigned
      required:
        - id
        - name
        - service
        - status

    withPrivilegeRefs:
      type: object
      properties:
        privileges:
          type: array
          items:
            type: string
          description: |-
            IDs of the privileges to assign to the role.
            A role must have at least one privilege assigned to it.
          minItems: 1
      example: |-
        {
          "privileges" : ["create.api.collection", "delete.api.collection"]
        }
